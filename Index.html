<script>
/* ================= Hilfsfunktionen ================= */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(s){ return String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
  .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function fuzzyEq(a,b){ const tol=b.length<=4?0:b.length<=7?1:2; return lev(a,b)<=tol; }
function matchText(input, answers, opt={}){
  let n=norm(input).replace(/^(der|die|das|ein|eine|einen|im) /,''); if(!n) return false;
  const toks=n.split(' ');
  if(opt.not && opt.not.some(w=>toks.includes(norm(w)))) return false;
  if(answers.some(a=>fuzzyEq(n,norm(a)))) return true;
  if(opt.keyword) return answers.some(a=>{ const na=norm(a); return n.includes(na) || toks.some(t=>fuzzyEq(t,na)); });
  return false;
}
function money(s){ const t=String(s).toLowerCase().replace(/\s+/g,' ').trim(); if(!t) return null;
  if(/^(null|nichts|leer)/.test(t)) return 0;
  let m=t.match(/(\d+)\s*(?:euro|€|eur)\s*(\d+)/); if(m) return (+m[1])*100+(+m[2]);
  const num=parseFloat(t.replace(',','.').replace(/[^0-9.]/g,'')); if(isNaN(num)) return null;
  if(/ct|cent/.test(t)) return Math.round(num);
  if(/euro|€|eur|[.,]/.test(t)) return Math.round(num*100);
  return num>=10 ? Math.round(num) : Math.round(num*100);
}
const isPress = l => matchText(l, ['druecken','drucken','schalter','knopf','taste','klick','klicken','tippen','umlegen','drueck','betaetigen'], {keyword:true});

/* ================= Speichern (nur auf diesem Gerät) ================= */
const TEACHER_CODE = '2026';   /* Code für die Ergebnisliste – hier ändern */
const KEY='zeta-spielstand-v1', RKEY='zeta-ergebnisse-v1';
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
let SAVED = store.get(KEY);
let teacher = {code:'', ok:false, wrong:false, confirmDel:false};
function save(){ if(S.screen!=='intro' && S.screen!=='results') store.set(KEY, S); }
function recordResult(){ if(S.recorded) return; S.recorded=true;
  const list=store.get(RKEY)||[]; const now=new Date();
  list.push({name:S.name||'ohne Namen', date:now.toLocaleDateString('de-DE')+' '+now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),
    total:total(), max:MAXTOTAL, decks:DECKS.map((_,i)=>deckScore(i)), hints:S.hints, second:S.second});
  store.set(RKEY, list); }
const DNAME = {d1:'Deck 1',d2:'Deck 2',d3:'Deck 3',d4:'Deck 4',d5:'Deck 5',d6:'Deck 6',end:'Ziel erreicht'};

/* ================= Spielzustand ================= */
const DECKS = ['Sternenkarte','Kantine','Labor','Funkraum','Maschinenraum','Kapsel'];
const DCOL = ['#8b6cf6','#ff6f61','#2fc58f','#4aa3ff','#e3a215','#d94c8a'];
const STICK = ['Sternen-Navigator','Kantinen-Held','Blubb-Forscher','Funk-Profi','Saft-Meister','Kapsel-Pilot'];
const ORDER = ['intro','d1','d2','d3','d4','d5','d6','end'];
const S = { name:'', screen:'intro', q:{}, hints:0, second:0, lastGap:{}, justOk:'', recorded:false,
  d1:{at:'Kepler', log:[], found:false}, d3:{state:0, log:[], anim:'idle'}, d5:{state:0, juice:0, log:[], msg:''},
  d6:{start:'', arrows:[], tool:'', from:'', to:'', label:'', sim:'', simMsg:''} };

/* ================= Aufgaben ================= */
const Q = {
 r1:{deck:0, type:'route', pts:2, img:'route', prompt:'Welcher Weg ist der kürzeste von Kepler nach ZETA? Schreibe die Buchstaben der Sprungtore der Reihe nach auf, zum Beispiel BAB.',
   ans:'ABA', solution:'A, B, A (Kepler → Nebula → Eisriese → ZETA)', hint:{text:'Schau auf die Sternenkarte. Starte beim Startpfeil (Kepler) und folge den Pfeilen bis zum doppelten Kreis. Der kürzeste Weg braucht genau 3 Sprünge.'}},
 r2:{deck:0, type:'choice', pts:2, img:'planet', prompt:'Die Sternenkarte ist ein Zustandsdiagramm. Was sind die Planeten in der Informatik?',
   options:['Eingaben','Zustände','Ausgaben'], correct:1, hint:{text:'Dein Shuttle ist immer an genau einem Planeten. Ein Automat ist immer in genau einem …'}},
 r3:{deck:0, type:'choice', pts:2, img:'flag', prompt:'ZETA ist das Ziel und hat einen doppelten Kreis. Wie heißt so ein Zustand?',
   options:['Startzustand','Übergang','Endzustand'], correct:2, hint:{text:'Wenn du ZETA erreichst, ist die Reise zu Ende.'}},
 k1:{deck:1, type:'gap', pts:2, img:'inout', prompt:'Ein Automat ist eine Maschine, die selbstständig arbeitet. Er bekommt eine ___ und erzeugt eine ___.',

const deckQ = i => Object.keys(Q).filter(k=>Q[k].deck===i);
const qs = id => S.q[id] || (S.q[id] = {tries:0, done:false, earned:0, hint:false, val: Q[id].type==='gap'?[]:'', wrong:[], correct:false});
const deckScore = i => deckQ(i).reduce((a,k)=>a+(S.q[k]?.earned||0),0);
const deckMax = i => deckQ(i).reduce((a,k)=>a+Q[k].pts,0);
const total = () => DECKS.reduce((a,_,i)=>a+deckScore(i),0);
const MAXTOTAL = DECKS.reduce((a,_,i)=>a+deckMax(i),0);
const deckAllDone = i => deckQ(i).every(k=>S.q[k]?.done);
const optText = o => typeof o==='string' ? o : o.t;

function evalQ(id){
  const q=Q[id], v=qs(id).val;
  if(q.type==='route') return String(v).toUpperCase().replace(/[^AB]/g,'')===q.ans;
  if(q.type==='money') return money(v)===q.ans;
  if(q.type==='text') return matchText(v, q.answers, {keyword:q.keyword, not:q.not});
  if(q.type==='gap') return q.gaps.every((g,k)=>matchText(v[k]||'', g, {keyword:q.keywordGaps?.[k], not:q.notGaps?.[k]}));
  if(q.type==='choice') return v===q.correct;
}
function check(id){
  const q=Q[id], st=qs(id); if(st.done) return;
  if(q.type==='choice'){ if(st.val===''||st.val==null) return; }
  else if(q.type==='gap'){ if(q.gaps.some((g,k)=>!String(st.val[k]||'').trim())) return; }
  else if(!String(st.val).trim()) return;
  if(evalQ(id)){ st.done=true; st.correct=true; st.earned = st.tries===0 ? q.pts : Math.ceil(q.pts/2); S.justOk=id; }
  else {
    if(q.type==='choice') st.wrong.push(st.val);
    st.tries++;
    if(st.tries===1){ st.hint=true; S.second++; } else { st.done=true; st.earned=0; }
  }
  render();
}

  const [sx,sy]=u(a.x,a.y,r),[ex,ey]=u(b.x,b.y,r+3);
  return {d:`M${sx.toFixed(1)},${sy.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`, lx:.25*sx+.5*cx+.25*ex, ly:.25*sy+.5*cy+.25*ey};

  if(d.start){ const c=BN[d.start]; const fromX = d.start==='aus' ? c.x-110 : c.x+110; const toX = d.start==='aus' ? c.x-BR-4 : c.x+BR+4;
    s+=`<line x1="${fromX}" y1="${c.y}" x2="${toX}" y2="${c.y}" class="bpedge" marker-end="url(#bpa)"/><text x="${(fromX+toX)/2}" y="${c.y-16}" class="bplab">Start</text>`; }
  const cnt={};
  d.arrows.forEach(a=>{ const k=a.from+a.to; cnt[k]=(cnt[k]||0); const extra=cnt[k]*34; cnt[k]++;
    let e; if(a.from===a.to){ e=loop(BN[a.from],BR, a.from==='aus'?'up':'down'); if(extra){ e.ly += (a.from==='aus'?-1:1)*extra*0.6; } }
    else e=arc(BN[a.from],BN[a.to],-46-extra,BR);
    s+=edgeSvg(e,a.label,false,'bpedge','bplab','bpa'); });
  ['aus','an'].forEach(k=>{ const c=BN[k]; const cls=['node', d.from===k?'from':'', d.start===k?'start':''].join(' ');
    s+=`<g class="${cls}" data-act="node" data-n="${k}" role="button" tabindex="0" aria-label="Zustand ${k}"><circle cx="${c.x}" cy="${c.y}" r="${BR+12}" fill="transparent"/>
      <circle class="ring" cx="${c.x}" cy="${c.y}" r="${BR}"/><text x="${c.x}" y="${c.y}" class="bpt">${k}</text></g>`; });
  return s+'</svg>';
}

function builderScore(){
  const d=S.d6; let wrong=0;
  const okStart=d.start==='aus';
  const aOk=d.arrows.some(a=>a.from==='aus'&&a.to==='an'&&isPress(a.label));
  const bOk=d.arrows.some(a=>a.from==='an'&&a.to==='aus'&&isPress(a.label));
  d.arrows.forEach(a=>{ if(!((a.from==='aus'&&a.to==='an')||(a.from==='an'&&a.to==='aus')) || !isPress(a.label)) wrong++; });
  const sc=Math.max(0,(okStart?2:0)+(aOk?2:0)+(bOk?2:0)-wrong);
  return {sc, okStart, aOk, bOk, wrong};
}

function qBlock(id, n){
  const q=Q[id], st=qs(id), done=st.done;
  let body='';
  if(q.type==='choice'){
    body=`<div class="${q.pics?'picgrid':'stack'}">${q.options.map((o,i)=>{ let c='opt'; let dis=done||st.wrong.includes(i);
      if(done){ if(i===q.correct) c+=' ok'; else if(st.wrong.includes(i)) c+=' bad'; } else if(st.wrong.includes(i)) c+=' bad';
      return `<button class="${c}" type="button" data-act="pick" data-q="${id}" data-i="${i}" aria-pressed="${st.val===i}" ${dis?'disabled':''}>${o.ic?svgIcon(o.ic,'oi'):''}<span>${esc(optText(o))}</span></button>`; }).join('')}</div>`;
  } else if(q.type==='gap'){
    const parts=q.prompt.split('___');
    body=`<p class="prompt" data-read>${parts.map((p,i)=> i<parts.length-1 ? esc(p)+`<input type="text" class="gap ${done?(st.correct?'ok':'bad'):''}" id="in-${id}-${i}" data-q="${id}" data-k="${i}" value="${esc(st.val[i]||'')}" autocomplete="off" spellcheck="false" aria-label="Lücke ${i+1}" ${done?'disabled':''}>` : esc(p)).join('')}</p>`;
  } else {
    body=`<input type="text" id="in-${id}" data-q="${id}" value="${esc(st.val)}" autocomplete="off" spellcheck="false" class="${done?(st.correct?'ok':'bad'):''}" ${done?'disabled':''}
      ${q.type==='money'?'placeholder="z. B. 50 ct"':q.type==='route'?'placeholder="z. B. BAB"':'placeholder="Deine Antwort"'} aria-label="Antwort">`;
  }
  const just = S.justOk===id;
  let status='';
  if(done && st.correct) status=`<div class="status good ${just?'pop':''}">${['Super!','Klasse!','Spitze!','Toll gemacht!'][n%4]} +${st.earned} Energie${st.tries?' (zweiter Versuch)':''}</div>`;
  else if(done) status=`<div class="status wrong">Nicht schlimm! Richtig ist: <b>${esc(q.solution || optText(q.options?.[q.correct]) || '')}</b></div>`;
  else if(st.tries===1) status=`<div class="status try">Fast! Lies BITs Tipp und versuche es noch einmal.</div>`;
  const hint = st.hint && !done ? sayChips(st.tries?'think':'happy', q.hint.text,
      q.hint.chips?`<div class="chips">${q.hint.chips.map(c=>`<button class="chip" type="button" data-act="chip" data-q="${id}" data-t="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:'') : '';
  const btns = done ? '' : `<div class="btnrow"><button class="btn sm mint" type="button" data-act="check" data-q="${id}">Prüfen</button>
      ${st.hint?'':`<button class="btn ghost" type="button" data-act="hint" data-q="${id}">BIT um Hilfe fragen</button>`}</div>`;
  const qtext = `${q.type==='gap'?'':`<p class="prompt" data-read>${q.prompt}</p>`}${body}`;
  return `<div class="qcard ${done?(st.correct?'ok':'bad'):''}">${just?confetti():''}<div class="qhead"><span class="qnum">Aufgabe ${n}</span><span class="pts">${bolt}${done?st.earned:q.pts} / ${q.pts}</span></div>
    ${q.img ? `<div class="qbody"><div class="qimg">${ICON[q.img]}</div><div class="qtext">${qtext}</div></div>` : qtext}
    ${status}${hint}${btns}</div>`;
}
function nextBtn(i, extraOk=true, label='Weiter zum nächsten Deck'){
  if(!(deckAllDone(i)&&extraOk)) return '';
  const sc=deckScore(i), mx=deckMax(i);
  return `<div class="reward pop">${sticker(i,sc)}<div class="rt"><h3>Neuer Sticker: ${STICK[i]}!</h3>
      <p data-read>Deck ${i+1} läuft wieder! Du hast ${sc} von ${mx} Energiepunkten gesammelt.${sc===mx?' Alles richtig, dein Sticker ist golden!':''}</p></div></div>
     <button class="btn big self" type="button" data-act="next">${label}</button>`;
}

      ${st.hint&&st.tries===0?say('happy','Du brauchst einen Startpfeil und zwei Pfeile. Was passiert, wenn das Licht aus ist und du drückst? Und was, wenn es an ist und du drückst?',true):''}
      <div class="btnrow"><button class="btn sm mint" type="button" data-act="build" ${d.start||d.arrows.length?'':'disabled'}>Bauplan einbauen</button>
      ${st.hint||st.tries?'':`<button class="btn ghost" type="button" data-act="hint" data-q="c1">BIT um Hilfe fragen</button>`}</div>`}
  </div>
  ${done ? qBlock('c2',2) : ''}
  ${nextBtn(5,true,'Kapsel starten')}`; },

end(){ const t=total(); const pct=t/MAXTOTAL; const rank=pct>=.9?'Kommandant:in':pct>=.7?'Offizier:in':pct>=.5?'Pilot:in':'Kadett:in in Ausbildung';
  const now=new Date(); const stamp=now.toLocaleDateString('de-DE')+', '+now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  return `<div class="art"><svg viewBox="0 0 400 180" aria-hidden="true"><rect width="400" height="180" fill="#5fb6ff"/><circle cx="340" cy="40" r="22" fill="#ffc93c"/>
    <ellipse cx="90" cy="40" rx="34" ry="12" fill="#fff"/><ellipse cx="250" cy="60" rx="28" ry="10" fill="#fff"/>
    <path d="M0,150 q100,-30 200,-6 q100,20 200,-10 L400,180 L0,180Z" fill="#2fc58f"/>
    <g class="descend"><path d="M162,26 Q200,-14 238,26 Z" fill="#ff6f61"/><path d="M181,26 Q200,0 219,26" fill="#fff" opacity=".5"/><line x1="166" y1="26" x2="190" y2="76" stroke="#23264d"/><line x1="234" y1="26" x2="210" y2="76" stroke="#23264d"/>
    <path d="M184,76 L216,76 L226,108 L174,108 Z" fill="#fff" stroke="#8a98d6" stroke-width="3"/><circle cx="200" cy="92" r="7" fill="#bfe9ff" stroke="#8a98d6" stroke-width="2"/></g></svg></div>
  ${confetti()}
  <span class="pill" style="--deck:#2fc58f">Mission geschafft</span>
  <h2 data-read>Gute Landung, ${esc(S.name||'Raumfahrer:in')}!</h2>
  ${say('cheer',`Du hast alle Automaten von ZETA repariert und bist sicher auf der Erde gelandet. Dein Rang: <b>${rank}</b>.`)}
  <div class="big">${t}<span style="font-size:.4em;color:var(--muted)"> / ${MAXTOTAL} Energie</span></div>
  <h3>Deine Sticker</h3>
  <div class="stickers">${DECKS.map((d,i)=>`<div class="sticker">${sticker(i,deckScore(i))}<b>${STICK[i]}</b><span>${deckScore(i)} / ${deckMax(i)}</span></div>`).join('')}</div>
  <p class="cap">BIT um Hilfe gefragt: ${S.hints}-mal · Zweiter Versuch gebraucht: ${S.second}-mal</p>
  <p class="cap" data-read>Zeige diesen Bildschirm deiner Lehrkraft. Gespielt am ${stamp}. Dein Ergebnis ist auf diesem Gerät gespeichert.</p>
  <button class="btn ghost self" data-act="restart" type="button">Neue Mission für das nächste Kind</button>`; }
};

/* ================= Steuerung ================= */
const app=document.getElementById('app'), bar=document.getElementById('bar');
const canSpeak='speechSynthesis' in window;
function renderBar(){
  const idx=ORDER.indexOf(S.screen)-1;
  const stars=DECKS.map((_,i)=>{ const fin=(deckAllDone(i)&&i<idx)||S.screen==='end';
    const f = fin ? (deckScore(i)===deckMax(i)?'#ffc93c':'#ffe39a') : (i===idx?'#fff3c9':'#eef0f8');
    return `<span title="Deck ${i+1}: ${DECKS[i]}">${starIcon(f, fin||i===idx?'#e3a215':'#c9cee6')}</span>`; }).join('');
  bar.innerHTML=`<div class="stars">${stars}</div><div class="energy">${bolt}${total()} / ${MAXTOTAL}</div>
    ${canSpeak?`<button class="speak" data-act="speak" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>Vorlesen</button>`:''}`;
}
function setDeckColor(){ const i=ORDER.indexOf(S.screen)-1; app.style.setProperty('--deck', DCOL[i] || '#8b6cf6'); }
function render(){ const y=window.scrollY; renderBar(); setDeckColor(); app.innerHTML=VIEWS[S.screen](); S.justOk=''; save(); window.scrollTo(0,y); }
function go(s){ S.screen=s; S.justOk=''; if(s==='end') recordResult(); save(); try{speechSynthesis.cancel()}catch(e){}; renderBar(); setDeckColor(); app.innerHTML=VIEWS[s](); window.scrollTo(0,0); app.focus({preventScroll:true}); }

function blubb(inp){ const d=S.d3; let out;
  if(inp==='keks'){ if(d.state===0){d.state=1; out='Mampf! Blubb kaut den Keks.'; d.anim='chew';}
    else if(d.state===1){d.state=2; out='Mampf! Blubb kaut und leuchtet grün.'; d.anim='glow';}
    else { out='Bäh! Blubb spuckt den Keks aus.'; d.anim='spit'; } }
  else { if(d.state===2){ d.state=0; out='Blubb tanzt wild herum.'; d.anim='dance'; } else { out='Blubb wackelt ein bisschen.'; d.anim='wiggle'; } }
  d.log.push({inp: inp==='keks'?'Sternkeks':'Musik', out}); render();
}
function coin(c){ const d=S.d5;
  if(c==='taste'){ if(d.state===3){ d.state=0; d.juice++; d.msg='Klack! Ein Astro-Saft kommt heraus. Der Automat ist wieder bei 0 ct.'; } else d.msg='Nichts passiert. Hier gibt es keinen Pfeil für die Taste.'; }
  else if(c==='50'){ if(d.state<3){ d.state++; d.msg='Klimper! Die 50-ct-Münze fällt hinein.'; } else d.msg='Die Münze fällt wieder heraus. Hier gibt es keinen Pfeil für 50 ct.'; }
  else { if(d.state<=1){ d.state+=2; d.msg='Klimper! Die 1-€-Münze fällt hinein.'; } else d.msg='Die Münze fällt wieder heraus. Hier gibt es keinen Pfeil für 1 €.'; }
  render();
}
function nodeClick(n){ const d=S.d6; if(qs('c1').done) return;
  if(d.tool==='start'){ d.start=n; d.tool=''; d.sim=''; d.simMsg=''; render(); return; }
  if(d.tool==='arrow'){ if(!d.from) d.from=n; else if(!d.to) d.to=n; render(); if(d.to) document.getElementById('arrowlabel')?.focus(); return; }
  d.simMsg='Wähle zuerst ein Werkzeug unter dem Bauplan.'; render();
}
function saveArrow(){ const d=S.d6; const l=(document.getElementById('arrowlabel')?.value||'').trim(); if(!l) return;
  d.arrows.push({from:d.from,to:d.to,label:l}); d.from=''; d.to=''; d.label=''; d.tool=''; d.sim=''; d.simMsg=''; render(); }
function press(){ const d=S.d6;
  if(!d.start){ d.simMsg='Der Bauplan hat noch keinen Startpfeil. Setze zuerst einen.'; render(); return; }
  if(!d.sim) d.sim=d.start;
  const a=d.arrows.find(x=>x.from===d.sim && isPress(x.label));
  if(a){ const old=d.sim; d.sim=a.to; d.simMsg=`Pfeil gefunden: von „${old}“ nach „${a.to}“. Das Licht ist ${a.to==='an'?'an!':'aus.'}`; }
  else d.simMsg=`Im Zustand „${d.sim}“ gibt es keinen Pfeil für „Schalter drücken“. Nichts passiert.`;
  render();
}
function build(){ const st=qs('c1'); if(st.done) return; const bs=builderScore();
  if(bs.sc===6 && st.tries===0){ st.done=true; st.correct=true; st.earned=6; S.justOk='c1'; }
  else if(st.tries===0){ st.tries=1; S.second++; }
  else { st.done=true; st.correct=bs.sc===6; st.earned=Math.min(bs.sc,3); if(st.correct) S.justOk='c1'; }
  S.d6.tool=''; S.d6.from=''; S.d6.to=''; render();
}

app.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, qid=el.dataset.q;
  switch(a){
    case 'start': S.name=document.getElementById('name').value.trim(); go('d1'); break;
    case 'next': go(ORDER[ORDER.indexOf(S.screen)+1]); break;
    case 'restart': store.del(KEY); SAVED=null; location.reload(); break;
    case 'resume': { const d=SAVED; SAVED=null; Object.assign(S, d); go(S.screen); break; }
    case 'discard': store.del(KEY); SAVED=null; render(); break;
    case 'teacher': teacher={code:'',ok:false,wrong:false,confirmDel:false}; go('results'); setTimeout(()=>document.getElementById('tcode')?.focus(),0); break;
    case 'tcheck': { const v=(document.getElementById('tcode')?.value||'').trim(); teacher.ok = v===TEACHER_CODE; teacher.wrong=!teacher.ok; render(); break; }
    case 'tdel': teacher.confirmDel=true; render(); break;
    case 'tdelno': teacher.confirmDel=false; render(); break;
    case 'tdelyes': store.del(RKEY); teacher.confirmDel=false; render(); break;
    case 'home': teacher.ok=false; go('intro'); break;
    case 'check': check(qid); break;
    case 'pick': qs(qid).val=+el.dataset.i; render(); break;
    case 'hint': { const st=qs(qid); if(!st.hint){ st.hint=true; S.hints++; } render(); break; }
    case 'chip': { const st=qs(qid), t=el.dataset.t;
      if(Q[qid].type==='gap'){ let k=S.lastGap[qid]; if(k==null){ k=Q[qid].gaps.findIndex((g,i)=>!String(st.val[i]||'').trim()); if(k<0) k=0; }
        st.val[k]=t; const nk=Q[qid].gaps.findIndex((g,i)=>!String(st.val[i]||'').trim()); S.lastGap[qid]= nk<0?k:nk; }
      else st.val=t; render(); break; }
    case 'jump': { const d=S.d1, to=P[d.at][el.dataset.g]; d.log.push({from:d.at, gate:el.dataset.g, to}); d.at=to; if(to==='ZETA') d.found=true; render(); break; }
    case 'blubb': blubb(el.dataset.in); break;
    case 'coin': coin(el.dataset.c); break;
    case 'tool': S.d6.tool = S.d6.tool===el.dataset.t ? '' : el.dataset.t; S.d6.from=''; S.d6.to=''; render(); break;
    case 'clear': Object.assign(S.d6,{start:'',arrows:[],tool:'',from:'',to:'',sim:'',simMsg:''}); render(); break;
    case 'node': nodeClick(el.dataset.n); break;
    case 'savearrow': saveArrow(); break;
    case 'cancelarrow': Object.assign(S.d6,{tool:'',from:'',to:'',label:''}); render(); break;
    case 'delarrow': S.d6.arrows.splice(+el.dataset.i,1); S.d6.sim=''; S.d6.simMsg=''; render(); break;
    case 'press': press(); break;
    case 'simreset': S.d6.sim=''; S.d6.simMsg='Neu gestartet. Der Schalter ist wieder im Startzustand.'; render(); break;
    case 'build': build(); break;
  }
});
app.addEventListener('input', e=>{ const t=e.target, qid=t.dataset.q;
  if(t.id==='arrowlabel'){ S.d6.label=t.value; return; }
  if(t.id==='name'){ S.name=t.value; return; }
  if(!qid) return; const st=qs(qid);
  if(t.dataset.k!=null) st.val[+t.dataset.k]=t.value; else st.val=t.value; });
app.addEventListener('focusin', e=>{ const t=e.target; if(t.dataset?.k!=null) S.lastGap[t.dataset.q]=+t.dataset.k; });
app.addEventListener('keydown', e=>{ const t=e.target;
  if(e.key==='Enter'){ if(t.id==='name'){ S.name=t.value.trim(); go('d1'); }
    else if(t.id==='tcode'){ app.querySelector('[data-act="tcheck"]')?.click(); }
    else if(t.id==='arrowlabel') saveArrow();
    else if(t.dataset?.q) check(t.dataset.q); }
  if((e.key==='Enter'||e.key===' ') && t.dataset?.act==='node'){ e.preventDefault(); nodeClick(t.dataset.n); } });
bar.addEventListener('click', e=>{ if(!e.target.closest('[data-act="speak"]')) return;
  try{ speechSynthesis.cancel(); const txt=[...app.querySelectorAll('[data-read], .bubble span')].map(n=>n.textContent.trim()).filter(Boolean).join(' ');
    const u=new SpeechSynthesisUtterance(txt); u.lang='de-DE'; u.rate=.9; speechSynthesis.speak(u); }catch(err){} });

window.claude?.hot?.snapshot?.(()=>JSON.parse(JSON.stringify(S)));
function start(data){ if(data && data.screen) Object.assign(S,data); else if(SAVED && SAVED.screen==='end'){ Object.assign(S,SAVED); SAVED=null; } renderBar(); setDeckColor(); app.innerHTML=VIEWS[S.screen](); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body></html>
